# omarchy-egpu-version: 0.1.3
#
# Installed as a drop-in of nvidia-suspend.service, nvidia-hibernate.service
# and nvidia-suspend-then-hibernate.service (the same bytes in all three), as
# /etc/systemd/system/<unit>.service.d/omarchy-egpu-sleep-guard.conf. Those are
# the units that run `nvidia-sleep.sh suspend|hibernate`.
#
# Two ExecCondition= lines, in this order (see the header of the guard, and
# systemd.service(5) for ExecCondition=):
#
#   1. The unload. If the NVIDIA modules are loaded with no NVIDIA GPU on the
#      PCI bus (an eGPU pulled without a safe eject), try to unload them. The
#      leading `-` ignores whatever happens, so this line can never skip or
#      fail the unit; `timeout -k 2 20` is the hard bound, the units being
#      Type=oneshot with no timeout of their own. (timeout exits 124 when it
#      fires, and exit 124 would skip the unit: that is why this line is a
#      separate one with a `-`.)
#   2. The verdict, `--check`. Exit 1 ONLY when the modules are still loaded
#      with no NVIDIA GPU on the bus (something holds them, so the unload could
#      not happen): systemd then skips this unit without failing it, and
#      nothing writes /proc/driver/nvidia/suspend, which would oops the kernel.
#      Exit 0 in every other case, including every error of the script.
#
# SuccessExitStatus=203 makes "the guard could not even be started" (203 is
# systemd's exec failure: a missing or non-executable file) mean "go on",
# not "skip". It also applies to the units' own commands, where it only makes
# a nvidia-sleep.sh that cannot be started count as done.
#
# Deliberately NOT here: a `timeout` around the --check line with the exit
# statuses 124 and 137 added to SuccessExitStatus=. That setting is per unit,
# so it would also hide a real timeout of nvidia-sleep.sh, and --check is
# bounded inside (docs/plan-engine.md 10.5). No TimeoutStartSec= either:
# nvidia-sleep.sh can legitimately take long.
[Service]
SuccessExitStatus=203
ExecCondition=-/usr/bin/timeout -k 2 20 /usr/local/bin/omarchy-egpu-sleep-guard
ExecCondition=/usr/local/bin/omarchy-egpu-sleep-guard --check
