# omarchy-egpu-version: 0.1.1
#
# Installed as a drop-in of nvidia-suspend.service and of
# nvidia-hibernate.service (the same bytes in both), as
# /etc/systemd/system/<unit>.service.d/omarchy-egpu-sleep-guard.conf.
#
# Before the NVIDIA sleep actions run, unload the NVIDIA modules if they are
# loaded with no NVIDIA GPU on the PCI bus (an eGPU pulled without a safe
# eject): suspending a removed GPU oopses nvidia_uvm. The leading `-` means
# that nothing the guard does, or fails to do, can stop the sleep. See the
# header of omarchy-egpu-sleep-guard.
[Service]
ExecStartPre=-/usr/local/bin/omarchy-egpu-sleep-guard
