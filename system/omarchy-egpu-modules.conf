# omarchy-egpu system half
# omarchy-egpu-version: 0.1.0
#
# A modules-load.d mask (plan-engine.md §9.2). system/install.sh installs this
# under /etc/modules-load.d/ with the SAME name as the file the driver package
# ships in /usr/lib/modules-load.d/ (this machine: nvidia-580xx-utils.conf,
# which loads nvidia-uvm). systemd-modules-load reads only one file per name
# and /etc wins, so this file, which loads nothing, keeps the eGPU's driver
# from loading at boot. It loads on connect, after the card exists (O3):
# loading it with no card present is the condition that froze this setup.
#
# `system/install.sh uninstall` removes it and restores what it replaced.
